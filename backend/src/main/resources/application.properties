spring.application.name=avaliacao-desempenho-competencias

server.error.include-binding-errors=never
server.error.include-message=never
server.error.include-stacktrace=never

# Não registrar corpos, valores rejeitados ou parâmetros JDBC, inclusive sob DEBUG genérico da VM.
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor=WARN
logging.level.org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor=WARN
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=WARN
logging.level.org.springframework.jdbc.core=INFO
logging.level.org.springframework.web.method=INFO

# Producao: somente a SPA publica confirmada. O ambiente de desenvolvimento deve
# sobrescrever este valor externamente, sem usar origem curinga com credenciais.
app.security.cors.allowed-origins=https://formulario.rodogarcia.com.br

# A persistência e a autenticação só são habilitadas quando a VM fornece as
# configurações externas protegidas. Não coloque URL, usuário, senha ou chave aqui.
app.persistence.sqlserver.enabled=false
app.security.authentication.enabled=false
app.evaluation-cycles.read.enabled=false
app.indicators.enabled=false
app.assessments.enabled=false
